[project]
name = "premiere-course-builder"
version = "0.1.0"
description = "Storyboard + slide clips + voiceover -> Premiere Pro project and MP4, with every animation build timed to the narration."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "mcp>=2.0"]

[project.scripts]
pcb = "pcb.cli:main"
pcb-mcp = "pcb.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pcb"]
